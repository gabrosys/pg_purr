services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
      args:
        PG_VERSION: ${PG_VERSION:-17}
        VCS_REF: ${VCS_REF:-dev}
        VERSION: ${VERSION:-0.2.0}
    container_name: pg-purr-test
    environment:
      POSTGRES_DB: pg_purr_test
      POSTGRES_USER: test
      # test-only credentials; do not reuse outside this compose file.
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 3s
      timeout: 3s
      retries: 10
