name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: publish-image (PG ${{ matrix.pg_version }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin the build time to the commit
        run: |
          epoch="$(git log -1 --format=%ct)"
          {
            echo "SOURCE_DATE_EPOCH=${epoch}"
            echo "BUILD_DATE=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "VCS_REF=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          outputs: type=image,rewrite-timestamp=true
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
            VERSION=${{ needs.release-please.outputs.version }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}-pg${{ matrix.pg_version }}
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}-pg${{ matrix.pg_version }}
      - name: Record digest
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          PG_VERSION: ${{ matrix.pg_version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}-pg${PG_VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  publish-dist:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r docker/requirements-dev.txt
      - name: Build the sdist and wheel
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}"
