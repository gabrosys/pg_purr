# Compose override for the planner demo.
# Layered on top of docker/docker-compose.test.yaml to inject
# DWAVE_API_TOKEN into the postgres container's environment.
#
# An empty / unset token still starts the container fine — step 04 handles
# the "no token" case explicitly.
services:
  postgres:
    environment:
      DWAVE_API_TOKEN: ${DWAVE_API_TOKEN:-}
